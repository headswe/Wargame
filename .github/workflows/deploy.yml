name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/tactical-rts-pmc-game-o0ex3f
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never interrupt a deploy that is already writing; just queue behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The playtest tool drives a real browser, but nothing in CI needs one,
      # and the download is far larger than the rest of the install combined.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The simulation is headless, so the whole tactical layer is testable
      # before anything ships. Roughly ten seconds — worth it every deploy.
      - name: Test the simulation
        run: npm test

      # Also runs tsc --noEmit.
      - name: Build
        run: npm run build

      # Do not add `enablement: true` here. It looks like it would let the
      # workflow turn Pages on by itself, but the default GITHUB_TOKEN may
      # deploy to Pages and not create the site, so it fails with
      # "Create Pages site failed: Resource not accessible by integration".
      # Pages has to be switched on once by hand, under
      # Settings -> Pages -> Source: GitHub Actions.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
